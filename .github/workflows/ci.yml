      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 4
      BROADCAST_CONNECTION: null
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_DATABASE: smartrest_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: smartrest_app
      DB_PORT: 5432
      DB_URL: ""
      DB_USERNAME: smartrest_app
      MAIL_MAILER: array
      NIGHTWATCH_ENABLED: false
      PULSE_ENABLED: false
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_pgsql, redis, zip, pcntl
          coverage: none

      - name: Prepare PostgreSQL App Role
        env:
          PGPASSWORD: smartrest
          TARGET_DATABASE: smartrest_test
          TARGET_RUNTIME_PASSWORD: smartrest_app
          TARGET_RUNTIME_USERNAME: smartrest_app
        run: |
          psql -h 127.0.0.1 -U smartrest -d smartrest_test <<'SQL'
          \getenv target_runtime_username TARGET_RUNTIME_USERNAME
          \getenv target_runtime_password TARGET_RUNTIME_PASSWORD
          \getenv target_database TARGET_DATABASE
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'target_runtime_username', :'target_runtime_password')
          WHERE NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = :'target_runtime_username'
          )
          \gexec
          ALTER ROLE :"target_runtime_username" NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD :'target_runtime_password';
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          GRANT CONNECT ON DATABASE :"target_database" TO :"target_runtime_username";
          GRANT USAGE, CREATE ON SCHEMA public TO :"target_runtime_username";
